{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | {% if perfil %}{{ perfil.nombres }}{% else %}Mi CV{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --sidebar-width-open: 260px;
            --sidebar-width-closed: 80px;
            --primary: #2563eb;     
            --sidebar-bg: #0f172a;   
            
            --bg-main: #f8fafc;      
            --bg-card: #ffffff;
            --text-main: #334155;    
            --text-muted: #64748b;
        }

        body.dark-mode {
            --bg-main: #0b1120;       
            --bg-card: #1e293b;       
            --text-main: #e2e8f0;     
            --text-muted: #94a3b8;
        }

        /* --- BASE --- */
        body {
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        /* --- SIDEBAR FLEXIBLE (ESTRUCTURA ROBUSTA) --- */
        aside {
            position: fixed;
            top: 0; left: 0;
            height: 100vh; /* Altura total de la ventana */
            width: var(--sidebar-width-closed);
            background: var(--sidebar-bg);
            color: white;
            z-index: 1000;
            display: flex;       /* Flexbox activado */
            flex-direction: column; /* Elementos uno debajo del otro */
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        aside:hover {
            width: var(--sidebar-width-open);
        }

        /* 1. SECCIÓN SUPERIOR (FIJA) */
        .sidebar-header {
            flex: 0 0 auto; /* No encoger ni estirar */
            padding: 20px 10px 10px 10px;
            text-align: center;
        }

        /* 2. SECCIÓN MEDIA (MENÚ SCROLLABLE) - AQUÍ ESTÁ LA MAGIA */
        .sidebar-menu {
            flex: 1 1 auto;  /* Ocupa todo el espacio sobrante */
            min-height: 0;   /* Crucial para que el scroll funcione dentro de flex */
            overflow-y: auto; /* Scroll vertical si hace falta */
            padding: 5px 10px;
            
            /* Ocultar barra de scroll visualmente pero mantener función */
            scrollbar-width: none; 
        }
        .sidebar-menu::-webkit-scrollbar { display: none; }

        /* 3. SECCIÓN INFERIOR (FIJA) */
        .sidebar-footer {
            flex: 0 0 auto; /* No encoger ni estirar */
            padding: 15px 10px;
            background: var(--sidebar-bg); /* Fondo sólido para tapar el scroll del menú */
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* --- ESTILOS DE ELEMENTOS (TAMAÑO EQUILIBRADO) --- */
        
        /* Avatar */
        .avatar-container {
            width: 45px; height: 45px; margin: 0 auto 10px;
            border-radius: 50%; overflow: hidden; border: 2px solid white;
            transition: 0.3s;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        aside:hover .avatar-container { width: 85px; height: 85px; } /* Un poco más grande al abrir */
        
        .user-info { opacity: 0; max-height: 0; overflow: hidden; transition: 0.3s; }
        aside:hover .user-info { opacity: 1; max-height: 120px; margin-bottom: 15px; }
        .user-name { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }

        /* Typewriter (Letras que se borran) */
        .typewriter {
            font-size: 0.8rem; color: #94a3b8; display: block; min-height: 1.5em; margin-top: 2px;
        }
        .typewriter::after { content: '|'; animation: blink 1s step-end infinite; color: var(--primary); }
        @keyframes blink { 50% { opacity: 0; } }

        /* Botón PDF */
        .btn-pdf {
            background: var(--primary); color: white; border-radius: 10px;
            padding: 10px; display: flex; align-items: center; justify-content: center;
            text-decoration: none; margin-bottom: 10px; transition: 0.2s;
            font-weight: 500; font-size: 0.9rem;
        }
        .btn-pdf:hover { transform: translateY(-2px); background: #3b82f6; }
        .btn-text, .nav-text { display: none; margin-left: 12px; white-space: nowrap; }
        aside:hover .btn-text, aside:hover .nav-text { display: inline-block; }

        /* Enlaces del Menú */
        nav a {
            display: flex; align-items: center; 
            padding: 11px 10px; /* Padding cómodo */
            color: var(--text-muted); text-decoration: none;
            border-radius: 10px; margin-bottom: 4px; transition: 0.2s;
            justify-content: center;
        }
        aside:hover nav a { justify-content: flex-start; padding-left: 15px; }
        
        nav a:hover, nav a.active { background: rgba(255,255,255,0.1); color: white; }
        nav a.active { background: var(--primary); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .nav-icon { font-size: 1.2rem; min-width: 24px; text-align: center; }

        /* Footer Buttons */
        .footer-btn {
            background: transparent; border: none; color: #94a3b8;
            width: 100%; padding: 10px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
            font-size: 0.95rem; text-decoration: none;
        }
        .footer-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        aside:hover .footer-btn { justify-content: flex-start; padding-left: 15px; }

        /* --- CONTENIDO PRINCIPAL --- */
        main { 
            margin-left: var(--sidebar-width-closed); 
            padding: 2.5rem; 
            transition: margin-left 0.3s ease;
        }
        aside:hover + main { margin-left: var(--sidebar-width-open); }

        /* ANIMACIONES EN EL CONTENIDO (Home, Cards, etc.) */
        .card {
            background: var(--bg-card); padding: 2rem; border-radius: 15px;
            box-shadow: var(--shadow-card); margin-bottom: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px); /* Se levanta al pasar el mouse */
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        body.dark-mode .card:hover { box-shadow: 0 15px 30px rgba(0,0,0,0.4); }

        /* Clases para fotos */
        .zoom-img { transition: transform 0.3s ease; }
        .zoom-img:hover { transform: scale(1.05); }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            aside {
                width: 100%; height: 60px; bottom: 0; top: auto; 
                flex-direction: row; justify-content: space-around; align-items: center;
                padding: 0; overflow: visible; border-top: 1px solid rgba(255,255,255,0.1);
            }
            aside:hover { width: 100%; }
            .sidebar-header, .btn-text, .nav-text, .sidebar-footer { display: none; }
            .sidebar-menu { 
                display: flex; flex-direction: row; overflow-x: auto; 
                width: 100%; padding: 0; align-items: center; justify-content: space-between;
            }
            nav { display: flex; width: 100%; justify-content: space-around; padding: 0 5px;}
            nav a { margin: 0; padding: 10px; border-radius: 50%; }
            .nav-icon { font-size: 1.3rem; }
            main { margin-left: 0; margin-bottom: 70px; padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <div class="avatar-container">
                {% if perfil.fotoperfil %}
                    <img src="{{ perfil.fotoperfil.url }}" class="avatar-img">
                {% else %}
                    <img src="https://via.placeholder.com/100" class="avatar-img">
                {% endif %}
            </div>
            <div class="user-info">
                <div class="user-name">{{ perfil.nombres }}</div>
                <span class="typewriter" id="typewriter-text"></span>
            </div>
            
            <a href="{% url 'cv_completo' %}" target="_blank" class="btn-pdf">
                <i class="fas fa-file-pdf"></i> <span class="btn-text">Descargar CV</span>
            </a>
        </div>

        <div class="sidebar-menu">
            <nav>
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <i class="fas fa-user nav-icon"></i> <span class="nav-text">Perfil</span>
                </a>
                <a href="{% url 'experiencia' %}" class="{% if 'experiencia' in request.path %}active{% endif %}">
                    <i class="fas fa-briefcase nav-icon"></i> <span class="nav-text">Experiencia</span>
                </a>
                <a href="{% url 'productos_academicos' %}" class="{% if 'productos_academicos' in request.path %}active{% endif %}">
                    <i class="fas fa-book nav-icon"></i> <span class="nav-text">Académico</span>
                </a>
                <a href="{% url 'productos_laborales' %}" class="{% if 'productos_laborales' in request.path %}active{% endif %}">
                    <i class="fas fa-tools nav-icon"></i> <span class="nav-text">Proyectos</span>
                </a>
                <a href="{% url 'cursos' %}" class="{% if 'cursos' in request.path %}active{% endif %}">
                    <i class="fas fa-graduation-cap nav-icon"></i> <span class="nav-text">Educación</span>
                </a>
                <a href="{% url 'reconocimientos' %}" class="{% if 'reconocimientos' in request.path %}active{% endif %}">
                    <i class="fas fa-trophy nav-icon"></i> <span class="nav-text">Logros</span>
                </a>
                <a href="{% url 'garage' %}" class="{% if 'garage' in request.path %}active{% endif %}">
                    <i class="fas fa-store nav-icon"></i> <span class="nav-text">Garage</span>
                </a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <a href="/admin/" target="_blank" class="footer-btn" title="Ir al Admin">
                <i class="fas fa-cog nav-icon"></i> <span class="nav-text">Admin Panel</span>
            </a>
            <button id="theme-toggle" class="footer-btn" title="Cambiar Tema">
                <i class="fas fa-moon nav-icon"></i> <span class="nav-text">Oscuro/Claro</span>
            </button>
        </div>
    </aside>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        // --- 1. MODO OSCURO ---
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = toggleBtn.querySelector('i');
        if(localStorage.getItem('theme') === 'dark'){
            body.classList.add('dark-mode');
            icon.classList.replace('fa-moon', 'fa-sun');
        }
        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            icon.className = isDark ? 'fas fa-sun nav-icon' : 'fas fa-moon nav-icon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // --- 2. TYPEWRITER SCRIPT ---
        const roles = [
            "{{ perfil.descripcionperfil|default:'Hola'|escapejs }}",
            "Desarrollador Web",
            "Seguridad Informática",
            "Python Expert"
        ];
        let roleIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typeElement = document.getElementById('typewriter-text');

        function type() {
            const currentRole = roles[roleIndex];
            if (isDeleting) charIndex--; else charIndex++;
            typeElement.textContent = currentRole.substring(0, charIndex);
            
            let typeSpeed = isDeleting ? 40 : 80;
            if (!isDeleting && charIndex === currentRole.length) {
                typeSpeed = 2000; isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false; roleIndex = (roleIndex + 1) % roles.length; typeSpeed = 500;
            }
            setTimeout(type, typeSpeed);
        }
        if (typeElement) document.addEventListener('DOMContentLoaded', type);
    </script>

</body> 
</html>
