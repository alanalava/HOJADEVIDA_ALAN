{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | {% if perfil %}{{ perfil.nombres }}{% else %}Mi CV{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --sidebar-width-open: 240px;   /* Un poco más angosta */
            --sidebar-width-closed: 70px;  /* Más compacta cerrada */
            --primary: #2563eb;     
            --sidebar-bg: #0f172a;   
            
            --bg-main: #f8fafc;      
            --bg-card: #ffffff;
            --text-main: #334155;    
            --text-muted: #64748b;
        }

        body.dark-mode {
            --bg-main: #0b1120;       
            --bg-card: #1e293b;       
            --text-main: #e2e8f0;     
            --text-muted: #94a3b8;
        }

        /* --- BASE --- */
        body {
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        /* --- SIDEBAR ESTRUCTURA --- */
        aside {
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            width: var(--sidebar-width-closed);
            background: var(--sidebar-bg);
            color: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        aside:hover {
            width: var(--sidebar-width-open);
        }

        /* 1. SECCIÓN SUPERIOR (PERFIL) - COMPACTA */
        .sidebar-header {
            padding: 15px 5px; /* Menos padding */
            flex-shrink: 0;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* 2. SECCIÓN MEDIA (MENÚ) - SCROLL ASEGURADO */
        .sidebar-menu {
            flex-grow: 1;
            overflow-y: auto; /* Scroll si no cabe */
            padding: 10px 5px;
            scrollbar-width: none; /* Ocultar barra visualmente */
        }
        .sidebar-menu::-webkit-scrollbar { display: none; }

        /* 3. SECCIÓN INFERIOR (FIJA ABAJO) - COMPACTA */
        .sidebar-footer {
            padding: 10px 5px; /* Menos padding */
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: var(--sidebar-bg);
        }

        /* --- ESTILOS COMPONENTES (MÁS PEQUEÑOS) --- */
        
        /* Foto y Nombre */
        .avatar-container {
            width: 40px; height: 40px; margin: 0 auto 8px; /* Más pequeña */
            border-radius: 50%; overflow: hidden; border: 2px solid white;
            transition: 0.3s;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;}
        /* Animación foto perfil al abrir sidebar */
        aside:hover .avatar-img { transform: scale(1.1); }
        aside:hover .avatar-container { width: 80px; height: 80px; }
        
        .user-info { opacity: 0; max-height: 0; overflow: hidden; transition: 0.3s; }
        aside:hover .user-info { opacity: 1; max-height: 100px; margin-bottom: 10px; }
        .user-name { font-weight: bold; font-size: 1rem; white-space: nowrap; }

        /* Botón PDF */
        .btn-pdf {
            background: var(--primary); color: white; border-radius: 8px;
            padding: 8px; /* Más pequeño */
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; margin-bottom: 10px; transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-pdf:hover { transform: scale(1.05); background: var(--primary-dark);}
        .btn-text, .nav-text { display: none; margin-left: 10px; white-space: nowrap; font-size: 0.9rem;}
        aside:hover .btn-text, aside:hover .nav-text { display: inline-block; }

        /* Enlaces del Menú (Más compactos) */
        nav a {
            display: flex; align-items: center; 
            padding: 10px 8px; /* Menos padding vertical */
            color: var(--text-muted); text-decoration: none;
            border-radius: 8px; 
            margin-bottom: 2px; /* Menos espacio entre botones */
            transition: 0.2s;
            justify-content: center;
        }
        aside:hover nav a { justify-content: flex-start; padding-left: 12px; }
        
        nav a:hover, nav a.active { background: rgba(255,255,255,0.1); color: white; }
        nav a.active { background: var(--primary); }
        .nav-icon { font-size: 1.1rem; min-width: 24px; text-align: center; } /* Iconos un poco más chicos */

        /* Botones Footer (Compactos) */
        .footer-btn {
            background: transparent; border: none; color: #94a3b8;
            width: 100%; padding: 8px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
            font-size: 0.9rem; text-decoration: none;
        }
        .footer-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        aside:hover .footer-btn { justify-content: flex-start; padding-left: 12px; }

        /* --- CONTENIDO PRINCIPAL Y ANIMACIONES --- */
        main { 
            margin-left: var(--sidebar-width-closed); 
            padding: 2rem; 
            transition: margin-left 0.3s ease;
        }
        aside:hover + main { margin-left: var(--sidebar-width-open); }

        /* --- ANIMACIONES TARJETAS Y FOTOS --- */
        
        /* Animación para las Tarjetas (Cards) */
        .card {
            background: var(--bg-card); padding: 2rem; border-radius: 15px;
            box-shadow: var(--shadow-card); margin-bottom: 20px;
            /* La magia ocurre aquí: */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        /* Al pasar el mouse por la tarjeta */
        .card:hover {
            transform: translateY(-7px); /* Se levanta */
            box-shadow: 0 15px 30px rgba(0,0,0,0.1); /* Sombra más profunda */
        }
        
        /* Sombra más oscura en modo oscuro */
        body.dark-mode .card:hover {
             box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        /* Clase genérica para animar fotos dentro del contenido */
        /* Úsala en tus plantillas así: <img class="zoom-on-hover" ...> */
        .zoom-on-hover {
            transition: transform 0.3s ease;
        }
        .zoom-on-hover:hover {
            transform: scale(1.05); /* Zoom suave */
        }


        /* --- RESPONSIVE (MÓVIL) --- */
        @media (max-width: 768px) {
            aside {
                width: 100%; height: 55px; bottom: 0; top: auto; 
                flex-direction: row; justify-content: space-around; align-items: center;
                padding: 0; overflow: visible; border-top: 1px solid rgba(255,255,255,0.1);
            }
            aside:hover { width: 100%; }
            .sidebar-header, .btn-text, .nav-text, .sidebar-footer { display: none; }
            .sidebar-menu { 
                display: flex; flex-direction: row; overflow-x: auto; 
                width: 100%; padding: 0; align-items: center; justify-content: space-between;
            }
            nav { display: flex; width: 100%; justify-content: space-around; padding: 0 10px;}
            nav a { margin: 0; padding: 8px; border-radius: 50%; }
            .nav-icon { font-size: 1.2rem; }
            main { margin-left: 0; margin-bottom: 60px; padding: 1rem; }
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <div class="avatar-container">
                {% if perfil.fotoperfil %}
                    <img src="{{ perfil.fotoperfil.url }}" class="avatar-img">
                {% else %}
                    <img src="https://via.placeholder.com/100" class="avatar-img">
                {% endif %}
            </div>
            <div class="user-info">
                <div class="user-name">{{ perfil.nombres }}</div>
            </div>
            
            <a href="{% url 'cv_completo' %}" target="_blank" class="btn-pdf">
                <i class="fas fa-file-pdf"></i> <span class="btn-text">Descargar</span>
            </a>
        </div>

        <div class="sidebar-menu">
            <nav>
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <i class="fas fa-user nav-icon"></i> <span class="nav-text">Perfil</span>
                </a>
                <a href="{% url 'experiencia' %}" class="{% if 'experiencia' in request.path %}active{% endif %}">
                    <i class="fas fa-briefcase nav-icon"></i> <span class="nav-text">Experiencia</span>
                </a>
                <a href="{% url 'productos_academicos' %}" class="{% if 'productos_academicos' in request.path %}active{% endif %}">
                    <i class="fas fa-book nav-icon"></i> <span class="nav-text">Académico</span>
                </a>
                <a href="{% url 'productos_laborales' %}" class="{% if 'productos_laborales' in request.path %}active{% endif %}">
                    <i class="fas fa-tools nav-icon"></i> <span class="nav-text">Proyectos</span>
                </a>
                <a href="{% url 'cursos' %}" class="{% if 'cursos' in request.path %}active{% endif %}">
                    <i class="fas fa-graduation-cap nav-icon"></i> <span class="nav-text">Educación</span>
                </a>
                <a href="{% url 'reconocimientos' %}" class="{% if 'reconocimientos' in request.path %}active{% endif %}">
                    <i class="fas fa-trophy nav-icon"></i> <span class="nav-text">Logros</span>
                </a>
                <a href="{% url 'garage' %}" class="{% if 'garage' in request.path %}active{% endif %}">
                    <i class="fas fa-store nav-icon"></i> <span class="nav-text">Garage</span>
                </a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <a href="/admin/" target="_blank" class="footer-btn" title="Ir al Admin">
                <i class="fas fa-cog nav-icon"></i> <span class="nav-text">Admin</span>
            </a>
            <button id="theme-toggle" class="footer-btn" title="Cambiar Tema">
                <i class="fas fa-moon nav-icon"></i> <span class="nav-text">Oscuro/Claro</span>
            </button>
        </div>
    </aside>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        // MODO OSCURO
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = toggleBtn.querySelector('i');

        if(localStorage.getItem('theme') === 'dark'){
            body.classList.add('dark-mode');
            icon.classList.replace('fa-moon', 'fa-sun');
        }

        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            icon.className = isDark ? 'fas fa-sun nav-icon' : 'fas fa-moon nav-icon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>

</body> 
</html>
