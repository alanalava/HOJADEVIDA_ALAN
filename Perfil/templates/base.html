{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | {% if perfil %}{{ perfil.nombres }}{% else %}Mi CV{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }

        :root {
            /* Dimensiones Sidebar */
            --sidebar-width-open: 260px;
            --sidebar-width-closed: 80px;
            
            /* Colores Base (Modo Claro) */
            --primary: #2563eb;     
            --sidebar-bg: #0f172a;   
            --bg-main: #f8fafc;      
            --bg-card: #ffffff;
            --text-main: #334155;    
            --text-muted: #64748b;
            
            /* ETIQUETAS (Modo Claro): Gris suave */
            --tag-bg: #e2e8f0;
            --tag-text: #475569;
            --tag-border: transparent;
        }

        body.dark-mode {
            /* Colores Base (Modo Oscuro) */
            --bg-main: #0b1120;       
            --bg-card: #1e293b;       
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            
            /* ETIQUETAS (Modo Oscuro - CORREGIDO) */
            --tag-bg: #0f172a;  /* Fondo muy oscuro */
            --tag-text: #94a3b8; /* Texto gris claro */
            --tag-border: #334155; /* Borde sutil */
        }

        body {
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* --- SIDEBAR --- */
        aside {
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            width: var(--sidebar-width-closed);
            background: var(--sidebar-bg);
            color: white;
            z-index: 1000;
            display: flex; flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            overflow: hidden; 
        }

        aside:hover { width: var(--sidebar-width-open); }

        .sidebar-header { 
            flex: 0 0 auto; padding: 20px 10px; 
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        /* MENU SCROLLABLE */
        .sidebar-menu { 
            flex: 1 1 auto; 
            overflow-y: auto; 
            padding: 0 10px; 
            min-height: 0; /* Clave para el scroll */
            scrollbar-width: none; 
        }
        .sidebar-menu::-webkit-scrollbar { display: none; }

        .sidebar-footer {
            flex: 0 0 auto; padding: 15px 10px;
            background: var(--sidebar-bg); 
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-evenly; gap: 10px;
        }

        /* PERFIL */
        .profile-link { display: block; flex-shrink: 0; }
        .avatar-container { 
            width: 50px; height: 50px; border-radius: 50%; overflow: hidden; 
            border: 2px solid white; transition: 0.3s;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        aside:hover .avatar-container { width: 90px; height: 90px; } 

        .user-info { text-align: center; opacity: 0; max-height: 0; overflow: hidden; transition: 0.3s; width: 100%;}
        aside:hover .user-info { opacity: 1; max-height: 150px; }
        .user-name { font-weight: 700; font-size: 1.1rem; color: white; display: block; margin-bottom: 5px;}
        .typewriter { font-size: 0.8rem; color: #94a3b8; display: block; min-height: 1.2em; }

        /* BOTÓN PDF (MODIFICADO PARA SOPORTAR <BUTTON>) */
        .btn-pdf {
            background: var(--primary); color: white !important; 
            border-radius: 10px; padding: 12px; width: 100%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; transition: 0.2s; white-space: nowrap; font-weight: 500;
            /* Agregados para que funcione como botón */
            border: none; cursor: pointer; font-size: 1rem; font-family: inherit;
        }
        .btn-pdf:hover { background: #3b82f6; transform: translateY(-2px); }
        .btn-text, .nav-text { display: none; margin-left: 10px; }
        aside:hover .btn-text, aside:hover .nav-text { display: inline-block; }

        /* NAV */
        nav a {
            display: flex; align-items: center; padding: 12px; color: #94a3b8; text-decoration: none;
            border-radius: 10px; margin-bottom: 5px; transition: 0.2s; justify-content: center;
        }
        aside:hover nav a { justify-content: flex-start; padding-left: 15px; }
        nav a:hover, nav a.active { background: rgba(255,255,255,0.1); color: white; }
        nav a.active { background: var(--primary); }
        .nav-icon { font-size: 1.2rem; min-width: 24px; text-align: center; }

        /* FOOTER BTNS */
        .footer-btn {
            background: rgba(255,255,255,0.05); border: none; color: #94a3b8;
            width: 45px; height: 45px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 1.2rem;
        }
        .footer-btn:hover { background: rgba(255,255,255,0.2); color: white; transform: scale(1.1); }

        /* --- MAIN --- */
        main { margin-left: var(--sidebar-width-closed); padding: 2rem; transition: margin-left 0.3s; }
        aside:hover + main { margin-left: var(--sidebar-width-open); }

        /* --- TARJETAS CON ANIMACIÓN --- */
        .card {
            background: var(--bg-card); padding: 2rem; border-radius: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 20px;
            color: var(--text-main);
            /* Animación suave al pasar mouse */
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }
        
        .card:hover {
            transform: translateY(-5px); 
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        /* TEXTOS VISIBLES EN OSCURO */
        body.dark-mode .card h1, body.dark-mode .card h2, body.dark-mode .card h3, 
        body.dark-mode .card p, body.dark-mode .card span, body.dark-mode .card div, 
        body.dark-mode .card strong { color: #ffffff !important; }
        
        /* --- ESTILO DE ETIQUETA (TAG) ARREGLADO --- */
        /* Esta es la clase que usa "Académico | 2026" */
        .tag-category {
            background-color: var(--tag-bg);
            color: var(--tag-text) !important;
            border: 1px solid var(--tag-border); /* Borde sutil solo en oscuro */
            padding: 5px 12px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            font-weight: 600;
            display: inline-block; 
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        
        /* BOTÓN AZUL */
        .btn-card-action {
            background-color: var(--primary); color: white !important;
            padding: 8px 15px; border-radius: 8px; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px; font-weight: 500;
            transition: 0.2s; border: none; cursor: pointer;
        }
        .btn-card-action:hover { background-color: #1d4ed8; transform: scale(1.05); }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            aside { width: 100%; height: 60px; bottom: 0; top: auto; flex-direction: row; padding: 0; overflow: visible;}
            aside:hover { width: 100%; }
            .sidebar-header, .sidebar-footer { display: none; }
            .sidebar-menu { display: flex; flex-direction: row; overflow-x: auto; width: 100%; padding: 0; justify-content: space-around; }
            nav { display: flex; width: 100%; justify-content: space-around; }
            nav a { padding: 10px; border-radius: 50%; }
            main { margin-left: 0; margin-bottom: 70px; padding: 1rem; }
        }

        /* --- ESTILOS DEL MODAL (NUEVO) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000;
            display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--bg-card); color: var(--text-main);
            padding: 30px; border-radius: 15px; width: 90%; max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .modal-title { margin-top: 0; color: var(--primary); margin-bottom: 20px;}
        .modal-options label { display: block; margin: 10px 0; cursor: pointer; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-close { background: #ef4444; border:none; color:white; padding: 8px 15px; border-radius:5px; cursor:pointer;}
        .btn-print { background: var(--primary); border:none; color:white; padding: 8px 15px; border-radius:5px; cursor:pointer;}
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <a href="{% url 'home' %}" class="profile-link">
                <div class="avatar-container">
                    {% if perfil.fotoperfil %}
                        <img src="{{ perfil.fotoperfil.url }}" class="avatar-img">
                    {% else %}
                        <div style="background:#333;width:100%;height:100%;"></div>
                    {% endif %}
                </div>
            </a>

            <div class="user-info">
                <span class="user-name">{{ perfil.nombres }}</span>
                <span class="typewriter" id="typewriter-text"></span>
            </div>
            
            <button onclick="openModal()" class="btn-pdf">
                <i class="fas fa-file-pdf"></i> <span class="btn-text">Descargar CV</span>
            </button>
        </div>

        <div class="sidebar-menu">
            <nav>
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <i class="fas fa-user nav-icon"></i> <span class="nav-text">Perfil</span>
                </a>
                <a href="{% url 'experiencia' %}" class="{% if 'experiencia' in request.path %}active{% endif %}">
                    <i class="fas fa-briefcase nav-icon"></i> <span class="nav-text">Experiencia</span>
                </a>
                
                <a href="{% url 'productos_academicos' %}" class="{% if 'productos_academicos' in request.path %}active{% endif %}">
                    <i class="fas fa-book nav-icon"></i> <span class="nav-text">Prod. Académicos</span>
                </a>
                <a href="{% url 'productos_laborales' %}" class="{% if 'productos_laborales' in request.path %}active{% endif %}">
                    <i class="fas fa-tools nav-icon"></i> <span class="nav-text">Proyectos</span>
                </a>
                <a href="{% url 'cursos' %}" class="{% if 'cursos' in request.path %}active{% endif %}">
                    <i class="fas fa-graduation-cap nav-icon"></i> <span class="nav-text">Cursos y Títulos</span>
                </a>
                <a href="{% url 'reconocimientos' %}" class="{% if 'reconocimientos' in request.path %}active{% endif %}">
                    <i class="fas fa-trophy nav-icon"></i> <span class="nav-text">Logros</span>
                </a>
                <a href="{% url 'garage' %}" class="{% if 'garage' in request.path %}active{% endif %}">
                    <i class="fas fa-store nav-icon"></i> <span class="nav-text">Garage</span>
                </a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <a href="/admin/" target="_blank" class="footer-btn" title="Admin">
                <i class="fas fa-cog"></i> 
            </a>
            <button id="theme-toggle" class="footer-btn" title="Tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </aside>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <div id="pdfModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">Configurar Impresión</h3>
            <form action="{% url 'cv_completo' %}" method="GET" target="_blank">
                <div class="modal-options">
                    <label><input type="checkbox" name="inc_exp" checked> Incluir Experiencia</label>
                    <label><input type="checkbox" name="inc_cur" checked> Incluir Cursos/Títulos</label>
                    <label><input type="checkbox" name="inc_rec" checked> Incluir Logros</label>
                    <label><input type="checkbox" name="inc_acad" checked> Incluir Prod. Académicos</label>
                    <label><input type="checkbox" name="inc_lab" checked> Incluir Proyectos</label>
                    <label><input type="checkbox" name="inc_gar"> Incluir Venta Garage</label>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-close" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-print" onclick="closeModal()">Generar PDF</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // LOGICA DEL MODAL (NUEVO)
        function openModal() { document.getElementById('pdfModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('pdfModal').style.display = 'none'; }

        // LOGICA DE TEMA (ORIGINAL)
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = toggleBtn.querySelector('i');
        
        function applyTheme(theme) {
            if(theme === 'dark'){ body.classList.add('dark-mode'); icon.className = 'fas fa-sun'; } 
            else { body.classList.remove('dark-mode'); icon.className = 'fas fa-moon'; }
        }
        applyTheme(localStorage.getItem('theme'));

        toggleBtn.addEventListener('click', () => {
            const newTheme = body.classList.contains('dark-mode') ? 'light' : 'dark';
            applyTheme(newTheme); localStorage.setItem('theme', newTheme);
        });

        const roles = ["Seguridad Informática", "{{ perfil.descripcionperfil|default:'Desarrollador Web'|escapejs }}"];
        let roleIndex = 0, charIndex = 0, isDeleting = false;
        const typeElement = document.getElementById('typewriter-text');

        function type() {
            const currentRole = roles[roleIndex];
            if (isDeleting) charIndex--; else charIndex++;
            typeElement.textContent = currentRole.substring(0, charIndex);
            let typeSpeed = isDeleting ? 40 : 80;
            if (!isDeleting && charIndex === currentRole.length) { typeSpeed = 2000; isDeleting = true; } 
            else if (isDeleting && charIndex === 0) { isDeleting = false; roleIndex = (roleIndex + 1) % roles.length; typeSpeed = 500; }
            setTimeout(type, typeSpeed);
        }
        if (typeElement) document.addEventListener('DOMContentLoaded', type);
    </script>
</body> 
</html>
