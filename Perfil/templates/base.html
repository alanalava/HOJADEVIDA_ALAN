{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | {% if perfil %}{{ perfil.nombres }}{% else %}Mi CV{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }
        :root {
            --sidebar-width-open: 280px; 
            --sidebar-width-closed: 80px;
            --primary: #2563eb; --sidebar-bg: #0f172a; --bg-main: #f8fafc; --bg-card: #ffffff;
            --text-main: #334155; --text-muted: #64748b; --tag-bg: #e2e8f0; --tag-text: #475569; --tag-border: transparent;
        }
        body.dark-mode {
            --bg-main: #0b1120; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #cbd5e1;
            --tag-bg: #0f172a; --tag-text: #94a3b8; --tag-border: #334155; 
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-main); color: var(--text-main); margin: 0; min-height: 100vh; overflow-x: hidden; transition: background 0.3s ease, color 0.3s ease; }

        /* SIDEBAR */
        aside {
            position: fixed; top: 0; left: 0; height: 100vh; width: var(--sidebar-width-closed);
            background: var(--sidebar-bg); color: white; z-index: 1000; display: flex; flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 4px 0 10px rgba(0,0,0,0.1); overflow: hidden; 
        }
        aside:hover { width: var(--sidebar-width-open); }
        .sidebar-header { flex: 0 0 auto; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .sidebar-menu { flex: 1 1 auto; overflow-y: auto; padding: 0 10px; scrollbar-width: none; }
        .sidebar-menu::-webkit-scrollbar { display: none; }
        .sidebar-footer { flex: 0 0 auto; padding: 15px 10px; background: var(--sidebar-bg); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-evenly; gap: 10px; }

        /* PERFIL */
        .profile-link { display: block; flex-shrink: 0; }
        .avatar-container { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid white; transition: 0.3s; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        aside:hover .avatar-container { width: 90px; height: 90px; } 
        .user-info { text-align: center; opacity: 0; max-height: 0; overflow: hidden; transition: 0.3s; width: 100%;}
        aside:hover .user-info { opacity: 1; max-height: 150px; }
        .user-name { font-weight: 700; font-size: 1.1rem; color: white; display: block; margin-bottom: 5px;}
        .typewriter { font-size: 0.8rem; color: #94a3b8; display: block; min-height: 1.2em; }

        /* BOTÓN PDF */
        .btn-pdf {
            background: var(--primary); color: white !important; border-radius: 10px; padding: 12px; width: 100%;
            display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s; white-space: nowrap; font-weight: 500;
            border: none; cursor: pointer; font-size: 1rem; font-family: inherit;
        }
        .btn-pdf:hover { background: #3b82f6; transform: translateY(-2px); }
        .btn-text, .nav-text { display: none; margin-left: 10px; }
        aside:hover .btn-text, aside:hover .nav-text { display: inline-block; }

        /* MENU ITEMS & SWITCHES */
        .menu-item-container { display: flex; align-items: center; margin-bottom: 5px; border-radius: 10px; transition: 0.2s; padding: 5px; }
        .menu-item-container:hover { background: rgba(255,255,255,0.05); }

        /* SWITCH OCULTO POR DEFECTO */
        .toggle-switch {
            position: relative; width: 34px; height: 18px; flex-shrink: 0; margin-right: 10px;
            display: none; /* Se oculta normalmente */
            opacity: 0; transition: opacity 0.3s ease;
        }
        /* CLASE MÁGICA: Cuando el sidebar tiene 'edit-mode', mostramos los switches */
        aside.edit-mode .toggle-switch { display: inline-block; opacity: 1; }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(16px); }

        .nav-link { flex-grow: 1; display: flex; align-items: center; padding: 8px; color: #94a3b8; text-decoration: none; border-radius: 5px; transition: opacity 0.3s; }
        .nav-link:hover, .nav-link.active { color: white; }
        
        /* CLASE PARA OCULTAR EL LINK CUANDO EL CHECK ESTÁ OFF */
        .nav-link.hidden-link { display: none !important; }
        
        .nav-icon { font-size: 1.2rem; min-width: 24px; text-align: center; }

        .footer-btn { background: rgba(255,255,255,0.05); border: none; color: #94a3b8; width: 45px; height: 45px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 1.2rem; }
        .footer-btn:hover { background: rgba(255,255,255,0.2); color: white; transform: scale(1.1); }
        .footer-btn.active { background: var(--primary); color: white; box-shadow: 0 0 10px rgba(37, 99, 235, 0.5); }

        main { margin-left: var(--sidebar-width-closed); padding: 2rem; transition: margin-left 0.3s; }
        aside:hover + main { margin-left: var(--sidebar-width-open); }
        .card { background: var(--bg-card); padding: 2rem; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 20px; color: var(--text-main); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        body.dark-mode .card h1, body.dark-mode .card h2, body.dark-mode .card h3, body.dark-mode .card p, body.dark-mode .card span, body.dark-mode .card div, body.dark-mode .card strong { color: #ffffff !important; }
        .tag-category { background-color: var(--tag-bg); color: var(--tag-text) !important; border: 1px solid var(--tag-border); padding: 5px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 12px; letter-spacing: 0.5px; }
        .btn-card-action { background-color: var(--primary); color: white !important; padding: 8px 15px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; transition: 0.2s; border: none; cursor: pointer; }
        
        @media (max-width: 768px) {
            aside { width: 100%; height: 60px; bottom: 0; top: auto; flex-direction: row; padding: 0; overflow: visible;}
            aside:hover { width: 100%; }
            .sidebar-header, .sidebar-footer { display: none; }
            .sidebar-menu { display: flex; flex-direction: row; overflow-x: auto; width: 100%; padding: 0; justify-content: space-around; }
            .menu-item-container { flex-direction: column; padding: 0; margin: 0; }
            .toggle-switch { display: none !important; } 
            .nav-link { padding: 10px; border-radius: 50%; justify-content: center; }
            .btn-text, .nav-text { display: none !important; }
            main { margin-left: 0; margin-bottom: 70px; padding: 1rem; }
        }
    </style>
</head>
<body>
    <form id="sidebarForm" action="{% url 'cv_completo' %}" method="GET" target="_blank">
        <aside id="main-sidebar">
            <div class="sidebar-header">
                <a href="{% url 'home' %}" class="profile-link">
                    <div class="avatar-container">
                        {% if perfil.fotoperfil %}
                            <img src="{{ perfil.fotoperfil.url }}" class="avatar-img">
                        {% else %}
                            <div style="background:#333;width:100%;height:100%;"></div>
                        {% endif %}
                    </div>
                </a>

                <div class="user-info">
                    <span class="user-name">{{ perfil.nombres }}</span>
                    <span class="typewriter" id="typewriter-text"></span>
                </div>
                
                <button type="submit" class="btn-pdf">
                    <i class="fas fa-file-pdf"></i> <span class="btn-text">Descargar CV</span>
                </button>
            </div>

            <div class="sidebar-menu">
                <div class="menu-item-container">
                    <div style="width: 44px;"></div> 
                    <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                        <i class="fas fa-user nav-icon"></i> <span class="nav-text">Perfil</span>
                    </a>
                </div>

                <div class="menu-item-container">
                    <label class="toggle-switch">
                        <input type="checkbox" name="inc_exp" checked onchange="toggleMenuLink(this)">
                        <span class="slider"></span>
                    </label>
                    <a href="{% url 'experiencia' %}" class="nav-link {% if 'experiencia' in request.path %}active{% endif %}">
                        <i class="fas fa-briefcase nav-icon"></i> <span class="nav-text">Experiencia</span>
                    </a>
                </div>
                
                <div class="menu-item-container">
                    <label class="toggle-switch">
                        <input type="checkbox" name="inc_acad" checked onchange="toggleMenuLink(this)">
                        <span class="slider"></span>
                    </label>
                    <a href="{% url 'productos_academicos' %}" class="nav-link {% if 'productos_academicos' in request.path %}active{% endif %}">
                        <i class="fas fa-book nav-icon"></i> <span class="nav-text">Prod. Académicos</span>
                    </a>
                </div>

                <div class="menu-item-container">
                    <label class="toggle-switch">
                        <input type="checkbox" name="inc_lab" checked onchange="toggleMenuLink(this)">
                        <span class="slider"></span>
                    </label>
                    <a href="{% url 'productos_laborales' %}" class="nav-link {% if 'productos_laborales' in request.path %}active{% endif %}">
                        <i class="fas fa-tools nav-icon"></i> <span class="nav-text">Proyectos</span>
                    </a>
                </div>

                <div class="menu-item-container">
                    <label class="toggle-switch">
                        <input type="checkbox" name="inc_cur" checked onchange="toggleMenuLink(this)">
                        <span class="slider"></span>
                    </label>
                    <a href="{% url 'cursos' %}" class="nav-link {% if 'cursos' in request.path %}active{% endif %}">
                        <i class="fas fa-graduation-cap nav-icon"></i> <span class="nav-text">Cursos y Títulos</span>
                    </a>
                </div>

                <div class="menu-item-container">
                    <label class="toggle-switch">
                        <input type="checkbox" name="inc_rec" checked onchange="toggleMenuLink(this)">
                        <span class="slider"></span>
                    </label>
                    <a href="{% url 'reconocimientos' %}" class="nav-link {% if 'reconocimientos' in request.path %}active{% endif %}">
                        <i class="fas fa-trophy nav-icon"></i> <span class="nav-text">Logros</span>
                    </a>
                </div>

                <div class="menu-item-container">
                    <label class="toggle-switch">
                        <input type="checkbox" name="inc_gar" onchange="toggleMenuLink(this)">
                        <span class="slider"></span>
                    </label>
                    <a href="{% url 'garage' %}" class="nav-link {% if 'garage' in request.path %}active{% endif %}">
                        <i class="fas fa-store nav-icon"></i> <span class="nav-text">Garage</span>
                    </a>
                </div>
            </div>

            <div class="sidebar-footer">
                <a href="/admin/" target="_blank" class="footer-btn" title="Admin">
                    <i class="fas fa-cog"></i> 
                </a>
                
                <button type="button" id="toggle-edit-mode" class="footer-btn" title="Configurar Menú">
                    <i class="fas fa-eye"></i>
                </button>

                <button type="button" id="theme-toggle" class="footer-btn" title="Tema">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </aside>
    </form>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        // 1. ACTIVAR MODO EDICIÓN (OJITO)
        const eyeBtn = document.getElementById('toggle-edit-mode');
        const sidebar = document.getElementById('main-sidebar');

        eyeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            sidebar.classList.toggle('edit-mode');
            eyeBtn.classList.toggle('active');
        });

        // 2. LOGICA PARA OCULTAR EL ENLACE DEL MENÚ
        function toggleMenuLink(checkbox) {
            // Buscamos el hermano 'a' (el enlace) que está al lado del label
            const container = checkbox.closest('.menu-item-container');
            const link = container.querySelector('a.nav-link');
            
            if(link) {
                if(checkbox.checked) {
                    link.classList.remove('hidden-link'); // Mostrar
                } else {
                    link.classList.add('hidden-link'); // Ocultar
                }
            }
        }

        // 3. PERSISTENCIA Y CARGA INICIAL
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        
        document.addEventListener('DOMContentLoaded', () => {
            checkboxes.forEach(chk => {
                const saved = localStorage.getItem('chk_' + chk.name);
                if (saved !== null) {
                    chk.checked = (saved === 'true');
                }
                // Aplicar visibilidad inicial
                toggleMenuLink(chk);
            });
        });

        // Guardar cambios en memoria
        checkboxes.forEach(chk => {
            chk.addEventListener('change', () => {
                localStorage.setItem('chk_' + chk.name, chk.checked);
            });
        });

        // TEMA OSCURO
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = toggleBtn.querySelector('i');
        
        function applyTheme(theme) {
            if(theme === 'dark'){ body.classList.add('dark-mode'); icon.className = 'fas fa-sun'; } 
            else { body.classList.remove('dark-mode'); icon.className = 'fas fa-moon'; }
        }
        applyTheme(localStorage.getItem('theme'));

        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const newTheme = body.classList.contains('dark-mode') ? 'light' : 'dark';
            applyTheme(newTheme); localStorage.setItem('theme', newTheme);
        });

        const roles = ["Seguridad Informática", "{{ perfil.descripcionperfil|default:'Desarrollador Web'|escapejs }}"];
        let roleIndex = 0, charIndex = 0, isDeleting = false;
        const typeElement = document.getElementById('typewriter-text');

        function type() {
            const currentRole = roles[roleIndex];
            if (isDeleting) charIndex--; else charIndex++;
            typeElement.textContent = currentRole.substring(0, charIndex);
            let typeSpeed = isDeleting ? 40 : 80;
            if (!isDeleting && charIndex === currentRole.length) { typeSpeed = 2000; isDeleting = true; } 
            else if (isDeleting && charIndex === 0) { isDeleting = false; roleIndex = (roleIndex + 1) % roles.length; typeSpeed = 500; }
            setTimeout(type, typeSpeed);
        }
        if (typeElement) document.addEventListener('DOMContentLoaded', type);
    </script>
</body> 
</html>
