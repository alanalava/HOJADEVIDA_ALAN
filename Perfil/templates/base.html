{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | {% if perfil %}{{ perfil.nombres }}{% else %}Mi CV{% endif %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --sidebar-width-open: 260px;   
            --sidebar-width-closed: 80px;  
            --primary: #2563eb;     
            --sidebar-bg: #0f172a;   
            
            --bg-main: #f8fafc;      
            --bg-card: #ffffff;
            --text-main: #334155;    
            --text-muted: #64748b;
        }

        body.dark-mode {
            --bg-main: #0b1120;       
            --bg-card: #1e293b;       
            --text-main: #e2e8f0;     
            --text-muted: #94a3b8;
        }

        /* --- BASE --- */
        body {
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        /* --- SIDEBAR FLEXIBLE (LA CLAVE) --- */
        aside {
            position: fixed;
            top: 0; left: 0;
            height: 100vh; /* Altura completa de la pantalla */
            width: var(--sidebar-width-closed);
            background: var(--sidebar-bg);
            color: white;
            z-index: 1000;
            display: flex;
            flex-direction: column; /* Organiza elementos de arriba a abajo */
            transition: width 0.3s ease;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            overflow: hidden; /* Oculta scroll feo general */
        }

        aside:hover {
            width: var(--sidebar-width-open);
        }

        /* 1. SECCIÓN SUPERIOR (PERFIL) - FIJA */
        .sidebar-header {
            padding: 20px 10px;
            flex-shrink: 0; /* No se encoge nunca */
            text-align: center;
        }

        /* 2. SECCIÓN MEDIA (MENÚ) - SCROLLABLE */
        /* Esto hace que si hay muchos items (Garage, etc), puedas bajar sin tapar la luna */
        .sidebar-menu {
            flex-grow: 1; /* Ocupa todo el espacio disponible en medio */
            overflow-y: auto; /* Permite scroll vertical SOLO en el menú */
            padding: 0 10px;
            scrollbar-width: none; /* Firefox: oculta barra */
        }
        .sidebar-menu::-webkit-scrollbar { display: none; } /* Chrome: oculta barra */

        /* 3. SECCIÓN INFERIOR (ADMIN Y LUNA) - FIJA ABAJO */
        .sidebar-footer {
            padding: 15px 10px;
            flex-shrink: 0; /* No se encoge nunca */
            border-top: 1px solid rgba(255,255,255,0.1);
            background: var(--sidebar-bg); /* Mismo fondo para tapar el scroll */
        }

        /* --- ESTILOS COMPONENTES --- */
        
        /* Foto y Nombre */
        .avatar-container {
            width: 45px; height: 45px; margin: 0 auto 10px; 
            border-radius: 50%; overflow: hidden; border: 2px solid white;
            transition: 0.3s;
        }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
        aside:hover .avatar-container { width: 90px; height: 90px; }
        
        .user-info { opacity: 0; max-height: 0; overflow: hidden; transition: 0.3s; }
        aside:hover .user-info { opacity: 1; max-height: 100px; margin-bottom: 15px; }
        .user-name { font-weight: bold; font-size: 1.1rem; white-space: nowrap; }

        /* Botón PDF */
        .btn-pdf {
            background: var(--primary); color: white; border-radius: 8px;
            padding: 10px; display: flex; align-items: center; justify-content: center;
            text-decoration: none; margin-bottom: 20px; transition: 0.2s;
        }
        .btn-pdf:hover { transform: scale(1.05); }
        .btn-text, .nav-text { display: none; margin-left: 10px; white-space: nowrap; }
        aside:hover .btn-text, aside:hover .nav-text { display: inline-block; }

        /* Enlaces del Menú */
        nav a {
            display: flex; align-items: center; padding: 12px;
            color: var(--text-muted); text-decoration: none;
            border-radius: 8px; margin-bottom: 5px; transition: 0.2s;
            justify-content: center; /* Centrado cuando está cerrado */
        }
        aside:hover nav a { justify-content: flex-start; padding-left: 15px; }
        
        nav a:hover, nav a.active { background: rgba(255,255,255,0.1); color: white; }
        nav a.active { background: var(--primary); }
        .nav-icon { font-size: 1.2rem; min-width: 25px; text-align: center; }

        /* Botones Footer */
        .footer-btn {
            background: transparent; border: none; color: #94a3b8;
            width: 100%; padding: 10px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
            font-size: 1rem; text-decoration: none;
        }
        .footer-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        aside:hover .footer-btn { justify-content: flex-start; padding-left: 15px; }

        /* --- CONTENIDO PRINCIPAL --- */
        main { 
            margin-left: var(--sidebar-width-closed); 
            padding: 2rem; 
            transition: margin-left 0.3s ease;
        }
        aside:hover + main { margin-left: var(--sidebar-width-open); }

        /* --- RESPONSIVE (MÓVIL) --- */
        @media (max-width: 768px) {
            aside {
                width: 100%; height: 60px; bottom: 0; top: auto; /* Barra abajo en móvil */
                flex-direction: row; justify-content: space-around; align-items: center;
                padding: 0; overflow: visible;
            }
            aside:hover { width: 100%; } /* No expandir en móvil */
            
            /* Ocultar cosas innecesarias en móvil */
            .sidebar-header, .btn-text, .nav-text, .sidebar-footer { display: none; }
            
            /* Menú horizontal */
            .sidebar-menu { 
                display: flex; flex-direction: row; overflow-x: auto; 
                width: 100%; padding: 0; align-items: center; justify-content: space-around;
            }
            
            nav { display: flex; width: 100%; justify-content: space-around; }
            nav a { margin: 0; padding: 10px; border-radius: 50%; }
            nav a.active { background: transparent; color: var(--primary); }
            
            main { margin-left: 0; margin-bottom: 70px; padding: 1rem; }
            
            /* Botón flotante para menú completo en móvil (Opcional, simple por ahora) */
        }
        
        /* CARD ESTILO */
        .card {
            background: var(--bg-card); padding: 2rem; border-radius: 15px;
            box-shadow: var(--shadow-card); margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <div class="avatar-container">
                {% if perfil.fotoperfil %}
                    <img src="{{ perfil.fotoperfil.url }}" class="avatar-img">
                {% else %}
                    <img src="https://via.placeholder.com/100" class="avatar-img">
                {% endif %}
            </div>
            <div class="user-info">
                <div class="user-name">{{ perfil.nombres }}</div>
            </div>
            
            <a href="{% url 'cv_completo' %}" target="_blank" class="btn-pdf">
                <i class="fas fa-file-pdf"></i> <span class="btn-text">Descargar</span>
            </a>
        </div>

        <div class="sidebar-menu">
            <nav>
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <i class="fas fa-user nav-icon"></i> <span class="nav-text">Perfil</span>
                </a>
                <a href="{% url 'experiencia' %}" class="{% if 'experiencia' in request.path %}active{% endif %}">
                    <i class="fas fa-briefcase nav-icon"></i> <span class="nav-text">Experiencia</span>
                </a>
                <a href="{% url 'productos_academicos' %}" class="{% if 'productos_academicos' in request.path %}active{% endif %}">
                    <i class="fas fa-book nav-icon"></i> <span class="nav-text">Académico</span>
                </a>
                <a href="{% url 'productos_laborales' %}" class="{% if 'productos_laborales' in request.path %}active{% endif %}">
                    <i class="fas fa-tools nav-icon"></i> <span class="nav-text">Proyectos</span>
                </a>
                <a href="{% url 'cursos' %}" class="{% if 'cursos' in request.path %}active{% endif %}">
                    <i class="fas fa-graduation-cap nav-icon"></i> <span class="nav-text">Educación</span>
                </a>
                <a href="{% url 'reconocimientos' %}" class="{% if 'reconocimientos' in request.path %}active{% endif %}">
                    <i class="fas fa-trophy nav-icon"></i> <span class="nav-text">Logros</span>
                </a>
                <a href="{% url 'garage' %}" class="{% if 'garage' in request.path %}active{% endif %}">
                    <i class="fas fa-store nav-icon"></i> <span class="nav-text">Garage</span>
                </a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <a href="/admin/" target="_blank" class="footer-btn" title="Ir al Admin">
                <i class="fas fa-cog nav-icon"></i> <span class="nav-text">Admin</span>
            </a>
            <button id="theme-toggle" class="footer-btn" title="Cambiar Tema">
                <i class="fas fa-moon nav-icon"></i> <span class="nav-text">Oscuro/Claro</span>
            </button>
        </div>
    </aside>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        // MODO OSCURO
        const toggleBtn = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = toggleBtn.querySelector('i');

        if(localStorage.getItem('theme') === 'dark'){
            body.classList.add('dark-mode');
            icon.classList.replace('fa-moon', 'fa-sun');
        }

        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            icon.className = isDark ? 'fas fa-sun nav-icon' : 'fas fa-moon nav-icon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>

</body> 
</html>
